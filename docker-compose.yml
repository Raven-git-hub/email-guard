# Email Guard, end to end.
#
#   bridge  ──IMAP──▶  dispatcher  ──docker run --rm──▶  scanner (one per message)
#                          │                                   │
#                          └──▶ socket-proxy ──▶ docker.sock    ▼
#                                                          data volume ◀── webui
#
# ---------------------------------------------------------------------------
# BEFORE `docker compose up`: copy .env.sample to .env and set both paths.
# ---------------------------------------------------------------------------
#
# EMAIL_GUARD_HOST_ROOT is not decoration, and it is the single most likely
# thing to get wrong. The dispatcher asks the *host's* docker daemon to bind
# directories into each scanner container, and the daemon resolves those paths
# on the host -- not inside the dispatcher's filesystem. So the dispatcher has
# to be told where its own mounts live from the host's point of view. Get it
# wrong and nothing appears broken: the scanner container starts, finds an
# empty directory where the rules pack should be, and reports a rules-pack
# error that says nothing whatsoever about mounts. `${VAR:?...}` below turns
# "unset" into a loud compose failure; "set but wrong" is only detectable on
# the host, which is what VALIDATION.md is for.
#
# EMAIL_GUARD_BRIDGE_CONFIG_DIR must point at an ALREADY-INITIALISED Proton
# Bridge config directory. This stack deliberately reuses the existing logged-in
# bridge rather than standing up a fresh one -- an empty volume would force the
# whole account re-login and keychain dance.
#
# The review console's exposure story is still two lines, still deliberately
# adjacent: `EMAIL_GUARD_WEBUI_HOST: 0.0.0.0` binds the container's interface
# (which is what lets a published port reach it at all), and the `ports:` entry
# decides who can see it. That second line now takes its bind address from
# `EMAIL_GUARD_WEBUI_BIND`, defaulting to `127.0.0.1` -- host loopback only.
# Setting it to `0.0.0.0` puts the console on the LAN, and .env.sample states
# the condition attached to doing that.

services:

  # -- the mail source ------------------------------------------------------
  bridge:
    # Built, not pulled -- see bridge/Dockerfile. The upstream image updates the
    # bridge binary in place, and the build it now pulls down needs
    # `libfido2.so.1`, which the image does not ship. The next restart after
    # that update never opens the IMAP listener, and the failure surfaces here
    # as a dispatcher that gets EOF from `bridge:143` forever. The three-line
    # Dockerfile installs the library so a clean `docker compose build && up`
    # yields a bridge that survives its own auto-updates.
    build: ./bridge
    image: email-guard-bridge:0.1.0
    container_name: email-guard-bridge
    restart: unless-stopped
    # Two networks, and it needs both.
    #
    # `mail` is internal and carries the dispatcher<->bridge IMAP hop. `egress`
    # is NOT internal, and the bridge cannot work without it: it has to reach
    # Proton to authenticate. On `mail` alone it fails DNS
    # ("lookup mail-api.proton.me ... server misbehaving"), never authenticates,
    # never opens its IMAP listener, and the dispatcher's connection attempts
    # get EOF -- a failure that looks like a dispatcher bug and is not one.
    #
    # The dispatcher stays off `egress` deliberately: it needs the bridge and
    # the socket-proxy, and nothing else. (An OFF-HOST webhook target is the one
    # thing that changes that -- see EMAIL_GUARD_WEBHOOK_URL below. An on-host
    # one does not: it is reached over that service's own network instead.)
    networks: [mail, egress]
    volumes:
      # The existing, already-logged-in bridge state. Read-write: the bridge
      # refreshes its own tokens. See VALIDATION.md before first start -- a
      # wrong path here looks exactly like "the bridge logged itself out".
      - "${EMAIL_GUARD_BRIDGE_CONFIG_DIR:?set EMAIL_GUARD_BRIDGE_CONFIG_DIR in .env to your existing Proton Bridge config dir}:/root"
    # No ports published. The dispatcher reaches it over the `mail` network by
    # service name; nothing on the host needs to.
    expose:
      - "1143"

  # -- the always-on watcher ------------------------------------------------
  dispatcher:
    build:
      context: .
      dockerfile: dispatcher/Dockerfile
    image: email-guard-dispatcher:0.1.0
    container_name: email-guard-dispatcher
    restart: unless-stopped
    depends_on: [bridge, docker-socket-proxy]
    networks: [mail, dockerproxy]

    # Its own uid is what it hands to `docker run --user`, so a root dispatcher
    # would produce root scanner containers. ContainerRunner refuses to start
    # if that happens rather than quietly doing it.
    user: "${EMAIL_GUARD_UID:-1000}:${EMAIL_GUARD_GID:-1000}"

    environment:
      # The deployed dispatcher defaults to the container runner. The *code*
      # default stays "subprocess" so a plain checkout and the test suite need
      # no daemon; isolation is a deployment decision, made here.
      EMAIL_GUARD_SCANNER_RUNNER: "container"
      EMAIL_GUARD_SCANNER_IMAGE: "email-guard-scanner:0.1.0"

      # Never /var/run/docker.sock. See docker-socket-proxy below.
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"

      # Both halves of every path mapping: where this container sees a tree,
      # and where the host daemon must be told to find it.
      EMAIL_GUARD_CONTAINER_DATA_DIR: "/app/data"
      EMAIL_GUARD_HOST_DATA_DIR: "${EMAIL_GUARD_HOST_ROOT:?set EMAIL_GUARD_HOST_ROOT in .env to this repo's absolute path on the host}/data"
      # WHICH rules tree the scanner reads. Both lines are parameterised, and
      # the defaults reproduce the pre-auto-updater wiring exactly: `./rules`,
      # the committed pack. Setting the two variables in .env is the whole
      # cutover to the managed, auto-updated tree -- see .env.sample and
      # VALIDATION.md, "Cut over to the managed rules tree".
      #
      #   default   NAME=rules       POINTER=          -> ${ROOT}/rules
      #   cut over  NAME=rules-live  POINTER=/current  -> ${ROOT}/rules-live/current
      #
      # The POINTER suffix is what makes a promote visible to THIS long-lived
      # container. See the volume below.
      EMAIL_GUARD_CONTAINER_RULES_DIR: "/app/rules${EMAIL_GUARD_RULES_LIVE_POINTER:-}"
      EMAIL_GUARD_HOST_RULES_DIR: "${EMAIL_GUARD_HOST_ROOT}/${EMAIL_GUARD_RULES_LIVE_NAME:-rules}${EMAIL_GUARD_RULES_LIVE_POINTER:-}"
      EMAIL_GUARD_CONTAINER_USER: "${EMAIL_GUARD_UID:-1000}:${EMAIL_GUARD_GID:-1000}"

      EMAIL_GUARD_IMAP_HOST: "bridge"

      # 143, not 1143. Those are two different things and mixing them up gets
      # you a flat connection refusal:
      #
      #   * 1143 is what the bridge listens on *inside* its own container, and
      #     what it publishes to the HOST when run standalone. Every Proton
      #     Bridge document quotes 1143 for that reason.
      #   * 143 is what the shenxn image exposes on the container network -- it
      #     runs socat in front, forwarding 143 to the bridge's own 1143.
      #
      # The dispatcher reaches the bridge over `mail`, so it wants the
      # container-network port.
      EMAIL_GUARD_IMAP_PORT: "${EMAIL_GUARD_IMAP_PORT:-143}"

      # Plaintext on this hop, by default and on purpose.
      #
      # `mail` is `internal: true`: no route off this host, no gateway, nothing
      # else attached but these two containers. The exposure is comparable to
      # loopback, which is the same reasoning that lets the dispatcher accept
      # the bridge's self-signed certificate over 127.0.0.1.
      #
      # TODO(bridge-tls): an *encrypted* internal hop is not currently
      # reachable. The bridge's self-signed certificate is issued for
      # `localhost` / `127.0.0.1`, so verification against the service name
      # `bridge` fails on hostname mismatch no matter which CA file is
      # supplied -- and there is deliberately no verify-off switch, because
      # `build_ssl_context` refuses to silently downgrade a non-loopback host.
      # Closing this needs a third TLS mode meaning "encrypt, trust this
      # specific certificate, skip the hostname check". Until then, plaintext
      # on a network with no route out is the honest option; a downgrade that
      # pretended to verify would be worse.
      EMAIL_GUARD_IMAP_TLS: "${EMAIL_GUARD_IMAP_TLS:-none}"
      EMAIL_GUARD_IMAP_CA_FILE: "${EMAIL_GUARD_IMAP_CA_FILE:-}"
      EMAIL_GUARD_IMAP_MAILBOX: "${EMAIL_GUARD_IMAP_MAILBOX:-INBOX}"

      # Bridge-generated credentials -- not the Proton account password.
      EMAIL_GUARD_IMAP_USERNAME: "${EMAIL_GUARD_IMAP_USERNAME:?set it in .env}"
      EMAIL_GUARD_IMAP_PASSWORD: "${EMAIL_GUARD_IMAP_PASSWORD:?set it in .env}"

      # Where each verdict is POSTed, if anywhere. Empty by default: unset means
      # no webhook sink is built at all, and the dispatcher stays egress-free.
      #
      # WHICH URL depends on where the target lives, and the answer that works
      # is usually the un-obvious one:
      #
      #   * ON THIS HOST (n8n, say): reach it over ITS docker network with its
      #     INTERNAL url -- `http://n8n:5678/webhook/...`. Attach the dispatcher
      #     to that network in an override file. Going out to the public
      #     hostname instead means a round-trip through the edge, and an edge bot
      #     filter will happily eat a POST from a container: Cloudflare answers
      #     `error 1010` and the delivery never lands.
      #   * OFF THIS HOST: a public URL, and the dispatcher then needs `egress`
      #     added to its `networks` in an override too. It has none by default,
      #     so an off-host URL alone silently fails to resolve.
      #
      # Both are documented override patterns, not baked defaults -- README,
      # "Optional webhook", has both files. The committed dispatcher reaches the
      # bridge and the socket-proxy and nothing else.
      EMAIL_GUARD_WEBHOOK_URL: "${EMAIL_GUARD_WEBHOOK_URL:-}"

    volumes:
      - email-guard-data:/app/data
      # The rules pack is version-controlled, not runtime data: read-only here,
      # and read-only again in every scanner container.
      #
      # After the cutover this binds `rules-live/` -- the DIRECTORY that holds
      # the `current` symlink -- and never `rules-live/current` itself. That
      # distinction is the whole reason a promote is visible without a restart:
      #
      #   * binding `.../current` makes the daemon resolve the symlink once, at
      #     container start, and mount the release it pointed at THEN. A later
      #     swap renames a directory entry this mount no longer consults, so
      #     this long-lived container would be pinned to that release forever.
      #   * binding the directory mounts the directory's own inode, so `current`
      #     is an entry inside it and the next path walk sees the new target.
      #
      # (`:ro` restricts writes through the mount; it does not freeze the
      # directory's contents.) Each SCANNER container is the opposite case and
      # wants the opposite thing -- it is fresh per message, so resolving
      # `.../current` at create time gives it one immutable release for its
      # whole life, and a swap mid-scan cannot affect it.
      - "./${EMAIL_GUARD_RULES_LIVE_NAME:-rules}:/app/rules:ro"
      - ./config/config.json:/app/config/config.json:ro

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # -- the only container that sees the docker socket -----------------------
  #
  # The dispatcher must create containers, and the obvious way to allow that --
  # bind-mounting /var/run/docker.sock into it -- is host-root-equivalent:
  # anyone who reaches that socket can start a privileged container mounting /.
  # Handing it to the process that handles hostile mail would defeat the point
  # of the per-message sandbox entirely.
  #
  # So the socket goes here instead, behind an allow-list, on a network with no
  # route off this host. Be clear-eyed about what that buys: CONTAINERS + POST
  # still permits container creation, which is inherently powerful. What it
  # removes is everything else -- images, volumes, networks, exec, swarm, the
  # system and info endpoints -- and it keeps the socket itself out of the
  # dispatcher's mount namespace. A large reduction, not an elimination.
  #
  # Keep this list as short as it will go. If the first real `docker run`
  # returns 403 from the proxy, the fix is HERE, not in the code -- most likely
  # `IMAGES: 1`, because `docker run` may inspect the local image before
  # creating a container. Add it only once a call is actually refused, and add
  # nothing else speculatively. VALIDATION.md has the diagnosis steps.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: email-guard-docker-proxy
    restart: unless-stopped
    networks: [dockerproxy]
    environment:
      CONTAINERS: 1   # create, inspect, list, wait, remove the scan containers
      POST: 1         # without this the proxy is read-only and nothing can run
      # Everything else stays at the image's default of 0. Named explicitly so
      # that turning one on is a visible, reviewable edit rather than a guess.
      IMAGES: 0       # <- the likely first addition if `docker run` 403s
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      INFO: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      AUTH: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      # Both, and /tmp is the one that matters: the proxy's entrypoint renders
      # its haproxy config to /tmp/haproxy.cfg at startup, so a read-only
      # rootfs without this crash-loops on
      # "can't create /tmp/haproxy.cfg: Read-only file system".
      # The point of read_only stands -- these are the only writable paths, and
      # both vanish with the container.
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true

  # -- the only component that runs git --------------------------------------
  #
  # Pulls the rules pack on an interval, validates it, and swaps a symlink so
  # the NEXT scanner container mounts the new tree. Nothing restarts: each
  # message is scanned by a fresh `docker run --rm`, so no long-lived process is
  # holding the old rules.
  #
  # Note what it deliberately cannot reach:
  #
  #   * NO /var/run/docker.sock and no DOCKER_HOST. It never creates a
  #     container, so it has no business being able to. The socket-proxy's
  #     allow-list is not widened for it.
  #   * NO data volume. The live lists, the daily brief and the dispatcher's
  #     state are personal data. A rules update and a list edit are independent
  #     operations, and this service touches only the first.
  #
  # It is the ONLY service in this file with a read-write rules mount. The
  # dispatcher's is `:ro`, and every scanner container's is `:ro` again.
  #
  # It runs whether or not the mounts have been cut over: until they are, it
  # maintains `rules-live/` alongside the `./rules` the scanner is still
  # reading, and the console shows what it has promoted. That makes the cutover
  # a two-line .env change against a tree that is already known to be good.
  rules-updater:
    build:
      context: .
      dockerfile: rules_sync/Dockerfile
    image: email-guard-rules-updater:0.1.0
    container_name: email-guard-rules-updater
    restart: unless-stopped

    # `egress` to reach GitHub; `rulesctl` so the console can ask for a manual
    # pull. Deliberately NOT on `mail` or `dockerproxy`.
    networks: [egress, rulesctl]

    # The operator's uid, so the tree this writes stays editable by hand on the
    # host -- the same reasoning as the console's.
    user: "${EMAIL_GUARD_UID:-1000}:${EMAIL_GUARD_GID:-1000}"

    environment:
      EMAIL_GUARD_RULES_REPO_URL: "${EMAIL_GUARD_RULES_REPO_URL:-https://github.com/Raven-git-hub/email-guard}"
      EMAIL_GUARD_RULES_BRANCH: "${EMAIL_GUARD_RULES_BRANCH:-main}"
      EMAIL_GUARD_RULES_SUBPATH: "${EMAIL_GUARD_RULES_SUBPATH:-rules}"
      # 24h by default; `off` disables the schedule and leaves manual refresh.
      EMAIL_GUARD_RULES_PULL_INTERVAL: "${EMAIL_GUARD_RULES_PULL_INTERVAL:-24h}"
      EMAIL_GUARD_RULES_KEEP_RELEASES: "${EMAIL_GUARD_RULES_KEEP_RELEASES:-3}"

      # The promote target, and the committed pack it seeds itself from.
      EMAIL_GUARD_RULES_LIVE_DIR: "/app/rules-live"
      EMAIL_GUARD_RULES_SEED_DIR: "/app/rules"

      # The control endpoint the console calls. 0.0.0.0 binds the container's
      # interface on `rulesctl` only -- there is no `ports:` key below, so it is
      # never published to the host.
      EMAIL_GUARD_RULES_CONTROL_HOST: "0.0.0.0"
      EMAIL_GUARD_RULES_CONTROL_PORT: "8090"
      EMAIL_GUARD_RULES_CONTROL_TOKEN: "${EMAIL_GUARD_RULES_CONTROL_TOKEN:-}"

      # git insists on a HOME, and the rootfs is read-only. /tmp is the tmpfs
      # below. Nothing is stored there: the point is that `~/.git-credentials`
      # and `~/.ssh` are not merely ignored, they are not present.
      HOME: "/tmp/git-home"

    volumes:
      # THE only read-write rules mount in the stack.
      - ./rules-live:/app/rules-live
      # The committed pack, as the seed. Read-only: this service must never
      # write the tracked tree.
      - ./rules:/app/rules:ro

    expose:
      - "8090"

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Health is "a scan container starting now would find a usable pack" -- NOT
    # "the last pull succeeded". An unreachable upstream, or a pack that was
    # correctly rejected, are both states in which this service is working
    # exactly as designed, and a restart would help neither.
    healthcheck:
      test: ["CMD", "python", "-m", "email_guard_rules_sync.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # -- the review console (unchanged) ---------------------------------------
  webui:
    build:
      context: .
      dockerfile: webui/Dockerfile
    image: email-guard-webui:0.1.0
    container_name: email-guard-webui
    restart: unless-stopped

    # Run as the operator, so the lists this service writes stay editable by
    # hand on the host. `id -u` / `id -g`, or leave the default.
    user: "${EMAIL_GUARD_UID:-1000}:${EMAIL_GUARD_GID:-1000}"

    # `default` is listed EXPLICITLY. Compose puts a service with no `networks:`
    # key on the default network; naming `rulesctl` alone would silently take it
    # off there, and the published port would stop working.
    networks: [default, rulesctl]

    environment:
      # The container binds every interface INSIDE its own namespace -- that is
      # what makes a published port reach it at all -- and the `ports:` entry
      # below decides who can actually connect. These two say the first part.
      EMAIL_GUARD_WEBUI_HOST: "0.0.0.0"
      EMAIL_GUARD_WEBUI_ALLOW_NON_LOOPBACK: "1"
      EMAIL_GUARD_WEBUI_PORT: "8080"

      # ... and this says the second, which the process cannot see for itself:
      # a container has no way to learn which host interface its port was
      # published on. Fed from the SAME variable as the `ports:` entry, so the
      # two cannot disagree.
      #
      # It is what lets the console refuse to start when it would be
      # unauthenticated on the LAN (`EMAIL_GUARD_WEBUI_BIND=0.0.0.0` with an
      # empty token) while still starting for the loopback-published default,
      # where "reachable from this host only" is doing the same job a token
      # would. Unset -- an older compose file against a newer image -- is read
      # as exposed, and then a token is required.
      EMAIL_GUARD_WEBUI_PUBLISHED_BIND: "${EMAIL_GUARD_WEBUI_BIND:-127.0.0.1}"

      # REQUIRED when EMAIL_GUARD_WEBUI_BIND is not loopback: the console
      # refuses to start LAN-reachable with this empty. See .env.sample.
      EMAIL_GUARD_WEBUI_TOKEN: "${EMAIL_GUARD_WEBUI_TOKEN:-}"

      # Where "Refresh rules" goes. The console has no git and no write access
      # to the rules tree by design -- it asks the updater, so exactly one
      # component owns git and the write path, and every pull in the system
      # (scheduled or manual) funnels through that one process's lock.
      #
      # Unset this and the button reports that the updater is not configured,
      # which is the right answer for a deploy that is not running it.
      EMAIL_GUARD_RULES_CONTROL_URL: "${EMAIL_GUARD_RULES_CONTROL_URL-http://rules-updater:8090}"
      EMAIL_GUARD_RULES_CONTROL_TOKEN: "${EMAIL_GUARD_RULES_CONTROL_TOKEN:-}"

    ports:
      # The container port stays 8080. Both HOST-side halves are variables, and
      # they are not equally consequential:
      #
      #   EMAIL_GUARD_WEBUI_HOST_PORT -- which port, so the console can move out
      #     of the way of whatever else already has 8080. Harmless.
      #   EMAIL_GUARD_WEBUI_BIND      -- which INTERFACE. This is the whole
      #     exposure story of a console that reads mail and edits the rules
      #     deciding what gets delivered, over plain HTTP.
      #
      # The default is `127.0.0.1` and it is deliberately baked in here rather
      # than left to `.env`: an unset variable, a fresh clone, or a missing
      # `.env` must all mean loopback-only. Exposure has to be an explicit,
      # visible act -- `EMAIL_GUARD_WEBUI_BIND=0.0.0.0`, which .env.sample says
      # requires EMAIL_GUARD_WEBUI_TOKEN -- never the fallback.
      #
      # (Previously this line hardcoded `127.0.0.1:`, which meant the one deploy
      # that wanted LAN access hand-edited a tracked file and collided with
      # every `git pull`. Parameterising it is what keeps the default honest:
      # the drift is now a line in .env, where it belongs.)
      - "${EMAIL_GUARD_WEBUI_BIND:-127.0.0.1}:${EMAIL_GUARD_WEBUI_HOST_PORT:-8080}:8080"

    volumes:
      # The same data the dispatcher and the scanner use: the console reads the
      # candidates they stage and writes the lists they read back.
      - email-guard-data:/app/data
      - ./config/config.json:/app/config/config.json:ro

    # Nothing outside the mounted data directory is ever written: the applier
    # writes its temp files as siblings of the list it is replacing, and
    # bytecode writing is off.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # -- build-only: the image the dispatcher runs per message ----------------
  #
  # Never started. It is here so `docker compose --profile build build scanner`
  # produces the tag EMAIL_GUARD_SCANNER_IMAGE names -- these two must agree,
  # or the dispatcher fails per message with "No such image".
  #
  # NOTE: scanner containers are created by the dispatcher, not by compose, so
  # they are not services and will not appear in `docker compose ps`. Find them
  # with `docker ps --filter label=email-guard.role=scanner`.
  scanner:
    profiles: ["build"]
    build:
      context: .
      dockerfile: scanner/Dockerfile
    image: email-guard-scanner:0.1.0

networks:
  # The dispatcher <-> bridge IMAP hop, and nothing else. Internal: no route
  # off this host, which is what makes plaintext on it defensible.
  mail:
    internal: true
  # The dispatcher and the socket-proxy, and nothing else on the host.
  dockerproxy:
    internal: true
  # The bridge's route to Proton. Ordinary bridge driver, deliberately NOT
  # internal -- the bridge cannot authenticate without egress, and an
  # internal-only bridge fails DNS and never opens its IMAP listener at all.
  # Only the bridge is attached.
  egress:
    driver: bridge
  # The console's "Refresh rules" button, and nothing else. Internal: no route
  # off this host, two containers attached. The console needs a way to ask the
  # updater for a pull, and this is deliberately the narrowest one -- the
  # alternative, giving the console its own git binary, its own egress and a
  # read-write rules mount, would put three new powers on the process that
  # renders hostile mail and create a second writer racing for one symlink.
  rulesctl:
    internal: true

volumes:
  # A named volume, so `docker compose down` and a container recreate cannot
  # take the done-list with them -- losing data/dispatcher/state.json would
  # replay the entire mailbox and re-fire every webhook.
  #
  # Bound to a known host directory rather than left in docker's own storage,
  # because the dispatcher must be able to name that host path when it mounts
  # subdirectories of it into each scanner container. This is the same
  # constraint EMAIL_GUARD_HOST_ROOT exists for, expressed once more.
  email-guard-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${EMAIL_GUARD_HOST_ROOT:?set EMAIL_GUARD_HOST_ROOT in .env}/data"
