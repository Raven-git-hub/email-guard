<!DOCTYPE html>
<html lang="en" data-theme="midnight-dark" data-fs="medium">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email Guard — UI mock</title>
<style>
:root[data-theme="midnight-dark"]{--bg-strip:#080a0f;--bg-main:#0f1117;--bg-card:#1a1d2e;--bg-hover:#1a1d2e;--border:#1e2130;--border-card:#2d3748;--accent:#6366f1;--accent-hover:#818cf8;--accent-muted:rgba(99,102,241,.13);--text:#e2e8f0;--text-muted:#4a5568;--text-mid:#a0aec0;--header-btn:#2d3748;}
:root[data-theme="midnight-light"]{--bg-strip:#f0f0f8;--bg-main:#f8f8ff;--bg-card:#e8e8f5;--bg-hover:#e8e8f5;--border:#dcdcea;--border-card:#c7c7dd;--accent:#6366f1;--accent-hover:#818cf8;--accent-muted:rgba(99,102,241,.13);--text:#2d2d5a;--text-muted:#9a9ab5;--text-mid:#5a5a80;--header-btn:#d7d7ea;}
:root[data-theme="slate-dark"]{--bg-strip:#0d0f12;--bg-main:#111318;--bg-card:#181c22;--bg-hover:#181c22;--border:#20242b;--border-card:#2b3038;--accent:#64748b;--accent-hover:#94a3b8;--accent-muted:rgba(100,116,139,.15);--text:#cbd5e0;--text-muted:#5b6472;--text-mid:#8b95a5;--header-btn:#2b3038;}
:root[data-theme="slate-light"]{--bg-strip:#f1f3f5;--bg-main:#f8f9fa;--bg-card:#e8eaed;--bg-hover:#e8eaed;--border:#dde0e4;--border-card:#c9ced4;--accent:#475569;--accent-hover:#64748b;--accent-muted:rgba(71,85,105,.13);--text:#1e293b;--text-muted:#94a0b0;--text-mid:#53617a;--header-btn:#d7dade;}
:root[data-theme="forest-dark"]{--bg-strip:#0a0f0a;--bg-main:#0c120c;--bg-card:#162016;--bg-hover:#162016;--border:#1b271b;--border-card:#294029;--accent:#4ade80;--accent-hover:#86efac;--accent-muted:rgba(74,222,128,.13);--text:#d1fae5;--text-muted:#4b6b53;--text-mid:#7fae8c;--header-btn:#294029;}
:root[data-theme="forest-light"]{--bg-strip:#f0f7f0;--bg-main:#f7fdf7;--bg-card:#e4f0e4;--bg-hover:#e4f0e4;--border:#d3e6d3;--border-card:#bcd9bc;--accent:#16a34a;--accent-hover:#22c55e;--accent-muted:rgba(22,163,74,.12);--text:#14532d;--text-muted:#7fa588;--text-mid:#3d7a53;--header-btn:#d5ead5;}
:root[data-theme="ember-dark"]{--bg-strip:#0f0a08;--bg-main:#120c08;--bg-card:#201408;--bg-hover:#201408;--border:#2a1c10;--border-card:#3f2a14;--accent:#f97316;--accent-hover:#fb923c;--accent-muted:rgba(249,115,22,.13);--text:#fed7aa;--text-muted:#6b4b30;--text-mid:#b58a63;--header-btn:#3f2a14;}
:root[data-theme="ember-light"]{--bg-strip:#fdf5f0;--bg-main:#fffaf7;--bg-card:#f8ede4;--bg-hover:#f8ede4;--border:#f0ddcd;--border-card:#e2c4a8;--accent:#ea580c;--accent-hover:#f97316;--accent-muted:rgba(234,88,12,.12);--text:#7c2d12;--text-muted:#b58a70;--text-mid:#9a5a3a;--header-btn:#f2e0d2;}
:root[data-theme="nord-dark"]{--bg-strip:#242933;--bg-main:#2e3440;--bg-card:#3b4252;--bg-hover:#3b4252;--border:#3b4252;--border-card:#4c566a;--accent:#88c0d0;--accent-hover:#8fbcbb;--accent-muted:rgba(136,192,208,.15);--text:#eceff4;--text-muted:#6b7a90;--text-mid:#a0adbf;--header-btn:#4c566a;}
:root[data-theme="nord-light"]{--bg-strip:#e5e9f0;--bg-main:#eceff4;--bg-card:#d8dee9;--bg-hover:#d8dee9;--border:#cdd5e0;--border-card:#c2ccda;--accent:#5e81ac;--accent-hover:#81a1c1;--accent-muted:rgba(94,129,172,.13);--text:#2e3440;--text-muted:#8b95a5;--text-mid:#4c566a;--header-btn:#d2d9e4;}
:root{--success:#4ade80;--warn:#fbbf24;--danger:#f87171;--danger-bg:#742a2a;}
:root[data-fs="small"]{--fs:10px;} :root[data-fs="medium"]{--fs:12px;} :root[data-fs="large"]{--fs:14px;}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--text);display:flex;justify-content:center;min-height:100vh;padding:16px 12px;}
.app{width:940px;max-width:100%;background:var(--bg-main);border:1px solid var(--border);
  border-radius:10px;overflow:hidden;display:flex;flex-direction:column;}

.header{background:var(--bg-strip);border-bottom:1px solid var(--border);min-height:44px;
  display:flex;align-items:center;gap:10px;padding:0 14px;}
.logo{width:26px;height:26px;border:1.5px solid var(--text-mid);border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text-mid);flex:0 0 auto;}
.logo svg{width:15px;height:15px;}
.header-title{font-size:14px;font-weight:600;letter-spacing:.06em;color:var(--text);flex:1;}
.header select{background:var(--bg-card);color:var(--text);border:1px solid var(--border-card);border-radius:5px;font-size:11px;padding:3px 5px;}

.content{padding:14px 14px 20px;}

.section-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin:16px 0 8px;position:relative;padding-bottom:5px;}
.section-label:first-child{margin-top:2px;}
.section-label::after{content:"";position:absolute;left:0;bottom:0;width:26px;height:2px;background:var(--accent);border-radius:2px;}

.card{background:var(--bg-card);border:1px solid var(--border-card);border-radius:8px;padding:12px;}
.card-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;}

/* rows */
.row2{display:grid;grid-template-columns:5fr 6fr;gap:12px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:12px;align-items:start;}
@media(max-width:820px){.app{width:100%}.row2,.row3{grid-template-columns:1fr}}

/* review */
.rev-top{display:flex;gap:12px;align-items:flex-start;}
.rev-addr{flex:1;min-width:0;}
.rev-addr .lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:3px;}
.rev-addr .addr{font-size:14px;word-break:break-all;line-height:1.4;}
.addr .hl{font-weight:700;color:var(--accent);}
.move-note{font-size:11px;color:var(--warn);margin-top:6px;min-height:14px;line-height:1.35;}
.member-note{font-size:11px;color:var(--text-muted);margin-top:2px;}
.seg-vert{display:flex;flex-direction:column;gap:4px;flex:0 0 92px;}
.seg{border:1px solid var(--border-card);background:transparent;color:var(--text-muted);border-radius:5px;padding:5px 8px;font-size:11px;font-weight:600;letter-spacing:.04em;cursor:pointer;text-align:left;transition:.12s;}
.seg:hover{background:var(--bg-hover);color:var(--text-mid);}
.seg.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.body-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin:12px 0 4px;}
.body-box{background:var(--bg-main);border:1px solid var(--border-card);border-radius:6px;padding:9px 11px;height:130px;overflow-y:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5;color:var(--text-mid);white-space:pre-wrap;user-select:text;}
.body-box .defang{color:var(--warn);}
.rev-lower{display:flex;gap:12px;margin-top:12px;}
.flags-box{flex:1;min-width:0;}
.mini-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px;}
.flag-chip{display:inline-block;background:var(--accent-muted);color:var(--accent);border:1px solid var(--accent);border-radius:4px;font-size:10px;padding:2px 6px;margin:0 4px 4px 0;}
.flag-chip.warn{background:transparent;color:var(--warn);border-color:var(--warn);}
.struct-box{flex:1.2;min-width:0;display:none;}
.struct-box.show{display:block;}
textarea,.form-entry{width:100%;background:var(--bg-main);border:1px solid var(--border-card);border-radius:6px;color:var(--text);font-size:12px;padding:7px 8px;font-family:inherit;resize:vertical;}
textarea:focus,.form-entry:focus{outline:none;border-color:var(--accent);}
textarea{height:48px;}
.seg-h{display:flex;gap:4px;margin-top:6px;}
.seg-h .seg{flex:1;text-align:center;padding:4px;}
.seg-h .seg.allow.active{background:var(--success);border-color:var(--success);color:#04140a;}
.seg-h .seg.block.active{background:var(--danger);border-color:var(--danger);color:#1a0505;}
.sb-toggle{display:flex;gap:4px;margin-top:6px;}
.sb-toggle .seg{flex:1;text-align:center;padding:3px;font-size:10px;}
.tag-row{margin-top:6px;}
.tag-row .form-entry{font-size:11px;padding:5px 7px;}
.rev-actions{display:flex;align-items:center;gap:8px;margin-top:14px;}
.queue-count{font-size:11px;color:var(--text-muted);flex:1;}
.btn{border-radius:6px;font-size:12px;font-weight:600;padding:7px 16px;cursor:pointer;border:1px solid var(--border-card);background:transparent;color:var(--text-mid);transition:.12s;}
.btn:hover{background:var(--bg-hover);color:var(--text);}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-primary:hover{background:var(--accent-hover);}
.btn-primary:disabled{background:var(--border-card);border-color:var(--border-card);color:var(--text-muted);cursor:not-allowed;}
.wd-toggle{font-size:11px;color:var(--text-mid);margin-top:8px;display:flex;align-items:center;gap:6px;cursor:pointer;}
.wd-toggle input{accent-color:var(--accent);}
.hidden{display:none!important;}
.empty-state{text-align:center;color:var(--text-muted);padding:30px 10px;font-size:13px;}
.empty-state .big{font-size:26px;color:var(--success);margin-bottom:6px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--accent);color:var(--text);padding:9px 16px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:50;}
.toast.show{opacity:1;bottom:28px;}

/* list data */
.tabs{display:flex;gap:5px;margin-bottom:10px;max-width:420px;}
.tab{flex:1;border:1px solid var(--border-card);background:transparent;color:var(--text-muted);border-radius:5px;padding:5px;font-size:10.5px;font-weight:600;letter-spacing:.04em;cursor:pointer;}
.tab.active{background:var(--accent-muted);color:var(--accent);border-color:var(--accent);}
.chart-cap{display:flex;justify-content:space-between;font-size:9.5px;color:var(--text-muted);margin-top:4px;}
.list-scroll{max-height:150px;overflow-y:auto;}
.list-item{padding:6px 4px;border-bottom:1px solid var(--border);font-size:12px;}
.list-item:last-child{border-bottom:none;}
.dom-head{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;}
.dom-head .caret{font-size:9px;color:var(--text-muted);transition:.15s;}
.dom-head.open .caret{transform:rotate(90deg);}
.struct-list{margin:4px 0 2px 14px;display:none;}
.struct-list.open{display:block;}
.struct-item{font-size:11px;padding:2px 0;color:var(--text-mid);display:flex;align-items:center;gap:6px;}
.pill{font-size:9px;padding:1px 6px;border-radius:10px;font-weight:700;letter-spacing:.03em;}
.pill.allow{background:rgba(74,222,128,.15);color:var(--success);}
.pill.block{background:rgba(248,113,113,.15);color:var(--danger);}
.tag-mini{font-size:9px;color:var(--text-muted);border:1px solid var(--border);border-radius:3px;padding:0 4px;}

.add-target{font-size:10px;color:var(--text-muted);margin-bottom:6px;}
.add-target b{color:var(--accent);}
.add-row{display:flex;gap:6px;margin-top:6px;}
.add-row .form-entry{flex:1;}

.log-row{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid var(--border);font-size:11px;}
.log-row:last-child{border-bottom:none;}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.dot.allowed{background:var(--text);} .dot.flagged{background:var(--warn);} .dot.rejected{background:var(--danger);}
.log-time{color:var(--text-muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}
.log-addr{color:var(--text-mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.cfg-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin:2px 0 4px;}
.hook-row{display:flex;gap:6px;margin-top:6px;}
.hook-row .form-entry{flex:1;font-size:11px;}
.icon-btn{border:1px solid var(--border-card);background:transparent;color:var(--text-mid);border-radius:5px;width:30px;cursor:pointer;font-size:14px;}
.icon-btn:hover{background:var(--bg-hover);color:var(--text);}
.icon-btn.danger:hover{background:var(--danger-bg);color:#fc8181;}
.copy-hint{font-size:10px;color:var(--text-muted);margin-top:6px;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.5 8 8 11 4.5-3 8-6 8-11V5l-8-3z"/></svg></div>
    <div class="header-title">EMAIL GUARD</div>
    <select id="fsSel" title="Content font size"><option value="small">A-</option><option value="medium" selected>A</option><option value="large">A+</option></select>
    <select id="themeSel" title="Theme"></select>
  </div>

  <div class="content">

    <!-- ROW 1: REVIEW -->
    <div class="section-label">Review</div>
    <div id="reviewArea"></div>

    <!-- ROW 2: GRAPH | LIST -->
    <div class="section-label">List Data</div>
    <div class="tabs" id="listTabs">
      <button class="tab" data-list="whitelist">WHITE</button>
      <button class="tab active" data-list="greylist">GREY</button>
      <button class="tab" data-list="blacklist">BLACK</button>
      <button class="tab" data-list="unknown">UNKNOWN</button>
    </div>
    <div class="row2">
      <div class="card">
        <div class="card-title" id="chartTitle">Recognitions · greylist</div>
        <svg id="chart" viewBox="0 0 320 92" width="100%" height="92" preserveAspectRatio="none"></svg>
        <div class="chart-cap"><span>7 days · 9 Aug</span><span>now · 16 Aug</span></div>
      </div>
      <div class="card">
        <div class="card-title" id="listTitle">Greylist</div>
        <div class="list-scroll" id="listScroll"></div>
      </div>
    </div>

    <!-- ROW 3: ADD | EVENT LOG | CONFIG -->
    <div class="row3" style="margin-top:14px;">
      <div class="card">
        <div class="card-title">Add</div>
        <div class="add-target" id="addTarget">adds to <b>greylist</b></div>
        <div id="addForm">
          <input class="form-entry" id="addInput" placeholder="@domain.example">
          <div class="seg-h" id="addDisp"><button class="seg allow" data-d="allow">ALLOW</button><button class="seg block" data-d="block">BLOCK</button></div>
          <div class="add-row" id="addStructRow"><input class="form-entry" id="addStruct" placeholder="known structure"></div>
          <div class="add-row"><input class="form-entry" id="addTags" placeholder="tags (optional)"></div>
          <div class="add-row"><button class="btn btn-primary" style="flex:1" onclick="toast('Added to list (mock)')">CONFIRM</button></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Event Log</div>
        <div id="eventLog"></div>
      </div>

      <div class="card">
        <div class="card-title">Config</div>
        <div class="cfg-lbl">Inbound bridge address</div>
        <input class="form-entry" id="inbound" value="raven_omnicore@pm.me">
        <div class="cfg-lbl" style="margin-top:12px;">Outbound POST webhooks</div>
        <div id="hooks"></div>
        <div class="add-row" style="margin-top:6px;"><button class="btn" style="flex:1" onclick="addHook()">+ Add source</button></div>
        <div class="copy-hint">Each scanned message is POSTed to every URL above.</div>
      </div>
    </div>

  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const THEMES=["midnight-dark","midnight-light","slate-dark","slate-light","forest-dark","forest-light","ember-dark","ember-light","nord-dark","nord-light"];
const tSel=document.getElementById('themeSel');
THEMES.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tSel.appendChild(o);});
tSel.value="midnight-dark";
tSel.onchange=()=>{document.documentElement.dataset.theme=tSel.value;drawChart();};
document.getElementById('fsSel').onchange=e=>document.documentElement.dataset.fs=e.target.value;

let toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1900);}

let queue=[
 {from:"googleplay-noreply@google.com",flags:["unknown_domain"],member:null,
  body:"Your Google Play Order Receipt\n\nThanks for your purchase. Order GPA.1234-5678.\nManage your subscriptions: hxxps://play.google[.]com/store/account\n\nThis is a service message."},
 {from:"promo@shopfast.example",flags:["unknown_domain"],member:{list:"greylist"},
  body:"FLASH SALE — 50% off everything this weekend only!\n\nTap to shop now: hxxps://shopfast[.]example/sale\nUnsubscribe: hxxps://shopfast[.]example/unsub"},
 {from:"security@paypa1-alerts.example",flags:["unknown_domain","obfuscation_visual"],member:null,
  body:"Your account has been LIMITED.\n\nVerify within 24 hours or it will be closed.\nConfirm identity: hxxp://paypa1-alerts[.]example/verify\n\nFailure to act will result in suspension."},
 {from:"julia.h.bennet@btinternet.com",flags:[],member:null,
  body:"Hi love,\n\nHope you're keeping well. Roast on Sunday? Bring the kids.\n\nGranny x"}
];
let choice=null, disp=null, wholeDomain=false;
function domainOf(e){const i=e.indexOf('@');return i<0?e:e.slice(i);}
function renderReview(){
  const area=document.getElementById('reviewArea');
  if(queue.length===0){area.innerHTML='<div class="card"><div class="empty-state"><div class="big">✓</div>All caught up — queue empty.</div></div>';return;}
  const c=queue[0]; choice=null; disp=null; wholeDomain=false;
  const local=c.from.slice(0,c.from.indexOf('@'));
  const dom=domainOf(c.from);
  const flagsHtml=c.flags.length?c.flags.map(f=>`<span class="flag-chip ${f.includes('obfusc')?'warn':''}">${f}</span>`).join(''):'<span style="font-size:11px;color:var(--text-muted)">none — routine unknown sender</span>';
  const memberTxt=c.member?`currently on the ${c.member.list}`:"not on any list yet";
  area.innerHTML=`<div class="card">
    <div class="rev-top">
      <div class="rev-addr">
        <div class="lbl">From</div>
        <div class="addr" id="addr"><span id="aLocal">${local}</span><span id="aDom">${dom}</span></div>
        <div class="member-note">${memberTxt}</div>
        <div class="move-note" id="moveNote"></div>
        <label class="wd-toggle hidden" id="wdToggle"><input type="checkbox" id="wdCheck"> list the whole domain, not just this address</label>
      </div>
      <div class="seg-vert">
        <button class="seg" data-c="whitelist">WHITE</button>
        <button class="seg" data-c="greylist">GREY</button>
        <button class="seg" data-c="blacklist">BLACK</button>
      </div>
    </div>
    <div class="body-lbl">Message body — links de-fanged, plain text only</div>
    <div class="body-box">${defang(c.body)}</div>
    <div class="rev-lower">
      <div class="flags-box"><div class="mini-lbl">Flags</div>${flagsHtml}</div>
      <div class="struct-box" id="structBox">
        <div class="mini-lbl">Known structure</div>
        <textarea id="structText" placeholder="paste a phrase from the body that identifies this shape"></textarea>
        <div class="sb-toggle"><button class="seg sbt active" data-sb="body">body match</button><button class="seg sbt" data-sb="subject">subject match</button></div>
        <div class="seg-h"><button class="seg allow" data-d="allow">ALLOW</button><button class="seg block" data-d="block">BLOCK</button></div>
        <div class="tag-row"><input class="form-entry" id="structTags" placeholder="tags (optional)"></div>
      </div>
    </div>
    <div class="rev-actions">
      <span class="queue-count">${queue.length} in queue</span>
      <button class="btn" onclick="skip()">Skip</button>
      <button class="btn btn-primary" id="confirmBtn" disabled onclick="confirmDecision()">Confirm</button>
    </div>
  </div>`;
  area.querySelectorAll('.seg[data-c]').forEach(b=>b.onclick=()=>pickList(b));
  area.querySelectorAll('.seg[data-d]').forEach(b=>b.onclick=()=>{disp=b.dataset.d;area.querySelectorAll('.seg[data-d]').forEach(x=>x.classList.remove('active'));b.classList.add('active');updateConfirm();});
  area.querySelectorAll('.sbt').forEach(b=>b.onclick=()=>{area.querySelectorAll('.sbt').forEach(x=>x.classList.remove('active'));b.classList.add('active');});
  const st=document.getElementById('structText'); if(st) st.oninput=updateConfirm;
  const wd=document.getElementById('wdCheck'); if(wd) wd.onchange=()=>{wholeDomain=wd.checked;paintAddr();};
}
function defang(t){return t.replace(/(hxxps?:\/\/[^\s]+)/g,'<span class="defang">$1</span>');}
function pickList(btn){
  choice=btn.dataset.c;
  document.querySelectorAll('.seg[data-c]').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  const grey=choice==='greylist';
  document.getElementById('structBox').classList.toggle('show',grey);
  document.getElementById('wdToggle').classList.toggle('hidden',grey);
  if(grey){wholeDomain=false;}
  paintAddr(); updateMoveNote(); updateConfirm();
}
function paintAddr(){
  const bold = choice==='greylist' || wholeDomain;
  document.getElementById('aDom').className = bold?'hl':'';
  document.getElementById('aLocal').style.opacity = bold?.5:1;
}
function updateMoveNote(){
  const c=queue[0], note=document.getElementById('moveNote');
  if(c.member && choice && c.member.list!==choice) note.textContent=`↳ ${domainOf(c.from).slice(1)} is on the ${c.member.list} — confirming moves it to the ${choice}.`;
  else note.textContent='';
}
function updateConfirm(){
  const btn=document.getElementById('confirmBtn'); if(!btn)return;
  let ok=false;
  if(choice==='whitelist'||choice==='blacklist') ok=true;
  else if(choice==='greylist') ok=document.getElementById('structText').value.trim()!=='' && !!disp;
  btn.disabled=!ok;
}
function confirmDecision(){
  const c=queue.shift();
  const where=choice==='greylist'?`greylisted ${domainOf(c.from).slice(1)} (${disp})`:(choice==='whitelist'?'whitelisted ':'blacklisted ')+(wholeDomain?domainOf(c.from).slice(1):c.from);
  toast('→ '+where); renderReview();
}
function skip(){ queue.push(queue.shift()); toast('Skipped — stays in queue'); renderReview(); }

const LISTS={
 whitelist:{items:[{k:"julia.h.bennet@btinternet.com",tags:["family"]},{k:"no-reply@github.com",tags:["dev"]}]},
 greylist:{items:[
   {k:"hsbc.com.hk",tags:["bank"],structs:[{n:"payment alert",d:"allow"},{n:"marketing blast",d:"block"}]},
   {k:"cathaypacific.com",tags:["travel"],structs:[{n:"boarding pass",d:"allow"},{n:"promo fares",d:"block"}]}]},
 blacklist:{items:[{k:"scam@fakeemail.example"},{k:"noreply@glassdoor.example"}]},
 unknown:{items:[{k:"googleplay-noreply@google.com"},{k:"promo@shopfast.example"},{k:"security@paypa1-alerts.example"}]}
};
let curList="greylist";
document.querySelectorAll('#listTabs .tab').forEach(t=>t.onclick=()=>{
  curList=t.dataset.list;
  document.querySelectorAll('#listTabs .tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); renderList(); drawChart();
});
function renderList(){
  const s=document.getElementById('listScroll'); const L=LISTS[curList]; const isGrey=curList==='greylist';
  document.getElementById('listTitle').textContent=curList.charAt(0).toUpperCase()+curList.slice(1);
  document.getElementById('chartTitle').textContent='Recognitions · '+curList;
  const isUnknown=curList==='unknown';
  document.getElementById('addTarget').innerHTML= isUnknown?'unknown senders are actioned in the <b>Review</b> panel above':`adds to <b>${curList}</b>`;
  document.getElementById('addForm').style.display=isUnknown?'none':'block';
  document.getElementById('addDisp').style.display=isGrey?'flex':'none';
  document.getElementById('addStructRow').style.display=isGrey?'flex':'none';
  document.getElementById('addInput').placeholder=isGrey?'@domain.example':'name@address.example';
  s.innerHTML=L.items.map(it=>{
    const tags=(it.tags||[]).map(t=>`<span class="tag-mini">${t}</span>`).join(' ');
    if(isGrey){
      const structs=it.structs.map(st=>`<div class="struct-item"><span class="pill ${st.d}">${st.d.toUpperCase()}</span>${st.n}</div>`).join('');
      return `<div class="list-item"><div class="dom-head" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')"><span class="caret">▶</span><span>${it.k}</span> ${tags}</div><div class="struct-list">${structs}</div></div>`;
    }
    return `<div class="list-item">${it.k} ${tags}</div>`;
  }).join('') || '<div style="font-size:11px;color:var(--text-muted);padding:8px">empty</div>';
}
const SERIES={whitelist:[4,6,5,9,8,12,11,14],greylist:[10,8,12,15,11,18,22,19],blacklist:[1,0,2,1,3,2,1,4],unknown:[20,18,24,16,22,19,25,27]};
function drawChart(){
  const svg=document.getElementById('chart'); const data=SERIES[curList]||SERIES.greylist;
  const w=320,h=92,pad=6,max=Math.max(...data);
  const xs=i=>pad+i*(w-2*pad)/(data.length-1), ys=v=>h-pad-v/(max||1)*(h-2*pad);
  const line=data.map((v,i)=>`${i?'L':'M'}${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(' ');
  const area=`${line} L${xs(data.length-1)},${h-pad} L${xs(0)},${h-pad} Z`;
  const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  svg.innerHTML=`<path d="${area}" fill="${acc}" opacity="0.12"/><path d="${line}" fill="none" stroke="${acc}" stroke-width="2" stroke-linejoin="round"/>`+data.map((v,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(v).toFixed(1)}" r="2" fill="${acc}"/>`).join('');
}
const EVENTS=[
 {v:"rejected",t:"16:04",a:"security@paypa1-alerts.example"},
 {v:"flagged",t:"15:58",a:"promo@shopfast.example"},
 {v:"allowed",t:"15:51",a:"julia.h.bennet@btinternet.com"},
 {v:"rejected",t:"15:47",a:"noreply@glassdoor.example"},
 {v:"flagged",t:"15:39",a:"googleplay-noreply@google.com"},
 {v:"allowed",t:"15:31",a:"payment.notification@hsbc.com.hk"}
];
document.getElementById('eventLog').innerHTML=EVENTS.map(e=>`<div class="log-row"><span class="dot ${e.v}"></span><span class="log-time">${e.t}</span><span class="log-addr">${e.a}</span></div>`).join('');

let hooks=["https://n8n.local/webhook/email-guard"];
function renderHooks(){
  document.getElementById('hooks').innerHTML=hooks.map((h,i)=>`<div class="hook-row"><input class="form-entry" value="${h}" onchange="hooks[${i}]=this.value"><button class="icon-btn danger" onclick="hooks.splice(${i},1);renderHooks()" title="remove">✕</button></div>`).join('');
}
function addHook(){hooks.push('');renderHooks();}

renderReview(); renderList(); drawChart(); renderHooks();
</script>
