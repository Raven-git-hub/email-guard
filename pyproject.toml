[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-guard-scanner"
version = "0.1.0"
description = "Email Guard scanner: one raw message + a rules pack in, a structured verdict out."
requires-python = ">=3.11"
# Deliberately zero runtime dependencies: the scanner parses mail with the
# stdlib `email` package and must run offline inside a throwaway container.
dependencies = []

[project.optional-dependencies]
# The web UI is the one component with runtime dependencies, and they stay
# optional: the scanner still installs and runs with nothing but the stdlib.
webui = ["fastapi>=0.110", "uvicorn>=0.27"]
# PyYAML is a *test* dependency only, and only for the compose assertions:
# several deployment facts (the bridge's egress network, the socket-proxy's
# tmpfs, the IMAP port) are only expressible in docker-compose.yml, and each
# was a real bring-up failure. Parsing it beats matching substrings.
dev = ["pytest>=7", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "pyyaml>=6"]

[project.scripts]
email-guard = "email_guard.cli:main"
email-guard-dispatcher = "email_guard_dispatcher.__main__:main"
email-guard-webui = "email_guard_webui.__main__:main"
email-guard-rules-sync = "email_guard_rules_sync.__main__:main"

# Four package roots, one distribution: the dispatcher runs the scanner as
# `python -m email_guard`, so they have to share an interpreter, and a single
# editable install keeps that true. The dispatcher imports nothing from the
# scanner -- the subprocess boundary is the whole interface. The web UI is the
# exception and imports the scanner directly: it is a consumer of the library,
# calling `apply`, `lists`, `propose` and `config` in-process.
#
# `rules_sync` (the rules pack auto-updater) imports nothing from any of them.
# It reaches the pack the way the pack's own CI does -- by running
# `rules/validate.py` as a subprocess -- so the pack, and its updater, stay
# independently movable to another repository.
#
# NOTE: every image's Dockerfile must COPY or `mkdir -p` all four roots, or
# `pip install .` fails on the missing ones. tests/test_rules_sync_deploy.py
# asserts that so the next root added cannot forget it.
[tool.setuptools.packages.find]
where = ["scanner", "dispatcher", "webui", "rules_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
