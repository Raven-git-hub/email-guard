[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-guard-scanner"
version = "0.1.0"
description = "Email Guard scanner: one raw message + a rules pack in, a structured verdict out."
requires-python = ">=3.11"
# Deliberately zero runtime dependencies: the scanner parses mail with the
# stdlib `email` package and must run offline inside a throwaway container.
dependencies = []

[project.optional-dependencies]
# The web UI is the one component with runtime dependencies, and they stay
# optional: the scanner still installs and runs with nothing but the stdlib.
webui = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[project.scripts]
email-guard = "email_guard.cli:main"
email-guard-dispatcher = "email_guard_dispatcher.__main__:main"
email-guard-webui = "email_guard_webui.__main__:main"

# Three package roots, one distribution: the dispatcher runs the scanner as
# `python -m email_guard`, so they have to share an interpreter, and a single
# editable install keeps that true. The dispatcher imports nothing from the
# scanner -- the subprocess boundary is the whole interface. The web UI is the
# exception and imports the scanner directly: it is a consumer of the library,
# calling `apply`, `lists`, `propose` and `config` in-process.
[tool.setuptools.packages.find]
where = ["scanner", "dispatcher", "webui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
